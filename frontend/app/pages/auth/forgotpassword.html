<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BaIn</title>
    <link rel="stylesheet" href="../../../global.css?v=2">
    <link rel="stylesheet" href="auth.css?v=10">
</head>
<body>
    <div class="navBar">
        <div class="nav">
            <a href="../loadingPage/loading.html#featuresBox">Features</a>
            <a href="../loadingPage/loading.html#howItWorkBox">How it works</a>
        </div>

        <div class="logo">
            <a href="../loadingPage/loading.html">Baby Info on Web</a>
        </div>

        <div class="signIn">
            <a href="login.html">Sign in</a>
        </div>
    </div>

    <div class="main-container" style="display: flex; justify-content: center; align-items: center; width: 100%;">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your email and the new password you want to set.</p>
            </div>

            <form id="forgotForm">
                <div class="input-group">
                    <label for="resetEmail">Email address</label>
                    <input type="email" id="resetEmail" required placeholder="you@example.com">
                </div>

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit">Update Password →</button>
            </form>

            <div class="form-footer" style="text-align: center; margin-top: 20px;">
                <a href="login.html" class="forgot-pass">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="forgot.js"></script>
</body>
</html>
