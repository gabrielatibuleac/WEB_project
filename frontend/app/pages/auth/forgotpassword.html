<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - BaIn</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <nav class="navBar">
        <div class="nav">
            <a href="../loadingPage/loading.html" style="text-decoration: none; color: var(--text-dark); font-weight: 600;">Home</a>
        </div>
        <a href="../loadingPage/loading.html" class="logo" style="text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 1.5rem;">
            <span>👶</span> LittleSteps
        </a>
        <div class="signIn">
            <a href="login.html" style="text-decoration: none; color: var(--white); background: var(--color-1); padding: 8px 20px; border-radius: 50px; font-weight: 600;">Login</a>
        </div>
    </nav>

    <div class="main-container" style="display: flex; justify-content: center; align-items: center; width: 100%;">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your email and the new password you want to set.</p>
            </div>
            <form id="forgotForm">
                <div class="input-group">
                    <label for="resetEmail">Email address</label>
                    <input type="email" id="resetEmail" required placeholder="you@example.com">
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password">
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 20px;">Update Password →</button>
            </form>
            <div class="form-footer" style="text-align: center; margin-top: 20px;">
                <a href="login.html" class="forgot-pass">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="forgot.js"></script>
</body>
</html>
